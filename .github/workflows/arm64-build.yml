# Peach ARM64 镜像：构建后直接推送到 Docker Hub
# 用法：fork peach-mitao/peach 后：
#  1. 注册 Docker Hub（hub.docker.com）
#  2. 在 Docker Hub 创建 Access Token
#  3. fork 仓库 Settings → Secrets and variables → Actions：
#     - Repository secrets 新增：DOCKERHUB_TOKEN = 上面的 Access Token
#     - Repository variables 新增：DOCKERHUB_USERNAME = 你的 Docker Hub 用户名
#  4. 用本文件替换 .github/workflows/arm64-build.yml
#  5. Actions 页面运行本 workflow，构建完成后镜像在 Docker Hub 的 <用户名>/peach:arm64
# 回家后在 NAS：docker pull <用户名>/peach:arm64 即可
name: Build and Push ARM64

on:
  workflow_dispatch:

jobs:
  arm64:
    name: Build linux/arm64 and push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/peach:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 双保险：同时保留 artifact，万一 Docker Hub 拉取不畅可走 tar 导入
      - name: Export image tarball
        run: docker pull ${{ vars.DOCKERHUB_USERNAME }}/peach:arm64 && docker save ${{ vars.DOCKERHUB_USERNAME }}/peach:arm64 | gzip > peach-arm64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: peach-arm64
          path: peach-arm64.tar.gz
          retention-days: 7
