# Peach ARM64 镜像云端构建工作流
# 用法：fork peach-mitao/peach 仓库后，把本文件添加到 .github/workflows/arm64-build.yml
# 然后在仓库 Actions 页面手动运行（workflow_dispatch），完成后下载 artifact：peach-arm64.tar.gz
name: Build ARM64

on:
  workflow_dispatch:

jobs:
  arm64:
    name: Build linux/arm64 and export tar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 单平台 arm64 构建（GitHub runner 内置 QEMU，自动模拟）
      - name: Build arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: peach:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 导出为 tar.gz 供下载，回家后在 NAS 上 docker load
      - name: Export image tarball
        run: docker save peach:arm64 | gzip > peach-arm64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: peach-arm64
          path: peach-arm64.tar.gz
          retention-days: 7
